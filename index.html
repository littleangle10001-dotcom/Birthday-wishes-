<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Bulbul 🎂</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff5f9e,#6a5cff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

#loading{
position:fixed;
width:100%;
height:100%;
background:#111;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:1000;
}

.loader{
width:70px;
height:70px;
border:8px solid #444;
border-top:8px solid #ff4d8d;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

h2{
margin-top:20px;
}

#main{
display:none;
text-align:center;
padding:20px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
background:#ff4d8d;
color:white;
cursor:pointer;
margin-top:25px;
}

button:hover{
background:#ff2d73;
}
</style>

</head>

<body>

<div id="loading">

<div class="loader"></div>

<h2>Preparing Your Surprise...</h2>

</div>

<div id="main">

<h1>🎂 Happy Birthday Bulbul 🎂</h1>

<h3>From Lazzy ❤️</h3>

<button onclick="alert('Next step coming soon 🎉')">
🎁 Tap To Open
</button>

</div>

<script>

setTimeout(()=>{

document.getElementById("loading").style.display="none";

document.getElementById("main").style.display="block";

},3000);

</script>

</body>
</html>
