<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4e8d,#7d5fff);
overflow:hidden;
color:white;
}

.container{
text-align:center;
padding:20px;
}

h1{
font-size:42px;
margin-bottom:15px;
}

p{
font-size:22px;
margin-bottom:30px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
background:#ff006e;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#surprise{
display:none;
animation:fadeIn 1s;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<div class="container">

<div id="start">
<h1>🎂 Happy Birthday Bulbul 🎂</h1>
<p>From Lazzy ❤️</p>

<button onclick="openGift()">
🎁 Tap To Open
</button>
</div>

<div id="surprise">
<h1>Coming Soon...</h1>
<p>Version 2 Loading ❤️</p>
</div>

</div>

<script>
function openGift(){
document.getElementById("start").style.display="none";
document.getElementById("surprise").style.display="block";
}
</script>

</body>
</html>
